[package]
name = "mp4decrypt"
version = "0.1.0"
edition = "2021"
description = "Rust port of Bento4 mp4decrypt with CENC (AES-CTR) progressive decryption, plus --download support for spade_a-keyed videos"
license = "MIT"

[[bin]]
name = "mp4decrypt"
path = "src/main.rs"

[dependencies]
aes = "0.8.4"
ctr = "0.9.2"
cbc = "0.1.2"
base64 = "0.22.1"
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
ureq = { version = "2.10.1", features = ["tls"] }
hex = "0.4.3"

[profile.release]
opt-level = 3
